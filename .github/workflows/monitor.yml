name: monitor

# Issues a forecast per site from live USGS data, scores forecasts whose target time has passed,
# applies the retrain rule and checks input drift. State (forecast log, cumulative scored table,
# reports) lives on the `monitoring` branch, so the forward holdout accumulates without touching main.
#
# Secrets (optional but recommended): USGS_API_KEY (shared runner IPs hit the anonymous quota),
# OPEN_METEO_API_KEY is only needed if live weather is turned back on (DOSENTINEL_WEATHER below).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      fail_on_retrain:
        description: "Fail the run when any site needs retraining"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serve.txt

      - name: Install
        # the bundles are pickles written with these exact versions (pandas 3 drops pytz and cannot load
        # them), so use the same pins as the Docker image
        run: |
          pip install -r requirements-serve.txt
          pip install --no-deps -e .
          pip install "mlflow>=2.14"

      - name: Restore monitoring state
        run: |
          if git ls-remote --exit-code --heads origin monitoring >/dev/null 2>&1; then
            git fetch origin monitoring:monitoring
            git worktree add ../state monitoring
          else
            git worktree add --orphan -b monitoring ../state
          fi

      - name: Run one monitoring cycle
        shell: bash  # -eo pipefail, so a failing run is not hidden by tee
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          # Live weather is off: the free weather endpoint times out from shared runner addresses, which
          # mixed weather-aware and weather-free forecasts in the forward holdout. Every forecast issued
          # from here on is the weather-free model, so the holdout scores one consistent forecaster.
          # Remove this line (and set OPEN_METEO_API_KEY) to turn weather back on.
          DOSENTINEL_WEATHER: "off"
        run: |
          python scripts/run_monitoring.py --state ../state \
            ${{ inputs.fail_on_retrain && '--fail-on-retrain' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish state
        if: always()
        working-directory: ../state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "monitoring cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin monitoring
