# Render Blueprint: New > Blueprint, pick this repository. Builds the Dockerfile and serves the API.
services:
  - type: web
    name: do-sentinel-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DOSENTINEL_CORS          # origins allowed to call the API from a browser
        value: https://mounusha25.github.io
      - key: DOSENTINEL_API_KEYS      # optional; comma-separated. When set, every route but /health needs X-API-Key.
        sync: false
      - key: DOSENTINEL_RATE_LIMIT    # requests per client per minute; 0 disables
        value: "60"
      - key: DOSENTINEL_WEATHER_SNAPSHOT_URL   # weather published by the scheduled job; used when the host's own fetch is throttled
        value: https://raw.githubusercontent.com/Mounusha25/DO_sentinel/monitoring/weather_snapshot.json
      - key: DOSENTINEL_WEATHER       # "off": serve the weather-free model, matching the monitored forward holdout
        value: "off"
      - key: OPEN_METEO_API_KEY       # optional paid key; removes the shared-address limit entirely
        sync: false
      - key: USGS_API_KEY             # optional; raises the USGS rate limit. Set in the dashboard, never commit it.
        sync: false
