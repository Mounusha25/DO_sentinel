[project]
name = "do-sentinel"
version = "0.1.0"
description = "Dissolved-oxygen forecasting, sensor-fault detection, and alert decisions on USGS continuous data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "requests>=2.31",
  "pyyaml>=6",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "joblib>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
